name: Deploy Elm app to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install standalone Elm compiler
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz \
            | gunzip > /tmp/elm
          chmod +x /tmp/elm
          sudo mv /tmp/elm /usr/local/bin/elm
      - name: Compile Elm frontend
        run: elm make app/Main.elm --output=public/elm.js --optimize
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
